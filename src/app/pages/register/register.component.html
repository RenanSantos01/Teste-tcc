<div class="auth-container">
  <div class="auth-card">

    <!-- TÍTULO -->
    <h2 class="auth-title">Criar Conta</h2>

    <!-- FORMULÁRIO -->
    <form (ngSubmit)="register()">

      <label class="auth-label">Nome completo</label>
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        required
        class="auth-input"
      >

      <label class="auth-label">Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        class="auth-input"
      >

      <label class="auth-label">Senha</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        class="auth-input"
      >

      <label class="auth-label">Confirmar senha</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        class="auth-input"
      >

      <button type="submit" class="btn-primary auth-btn">
        Cadastrar
      </button>
    </form>

    <!-- MENSAGENS -->
    <p *ngIf="error" class="auth-error">{{ error }}</p>
    <p *ngIf="success" class="auth-success">Conta criada com sucesso! ✔</p>

    <!-- BOTÃO PARA LOGIN -->
    <button class="btn-secondary auth-btn" (click)="goToLogin()">
      Já tem conta? Fazer login
    </button>

  </div>
</div>

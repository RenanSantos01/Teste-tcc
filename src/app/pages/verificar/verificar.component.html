<div class="container">
    <h2>Verificar Certificado</h2>
  
    <label>Insira o hash do certificado:</label>
    <input type="text" [(ngModel)]="hash" placeholder="Cole aqui o hash" />
  
    <button (click)="verificar()">Verificar</button>
  
    <div *ngIf="valido !== null" 
         [class.sucesso]="valido"
         [class.erro]="!valido">
      {{ resultado }}
    </div>
  </div>

<div class="home-container">

  <!-- NAVBAR FUTURISTA -->
  <nav class="navbar">
    <div class="logo">Certify<span>Flow</span></div>

    <div class="nav-actions">
      <button class="logout-btn" (click)="logout()">Sair</button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero-section">
    
    <div class="glass-badge">
      🔗 Certificados digitais e autenticação blockchain
    </div>

    <h1 class="hero-title">
      Tecnologia moderna<br />para instituições modernas
    </h1>

    <p class="hero-subtitle">
      Plataforma segura para emissão e validação de certificados acadêmicos,
      com autenticação descentralizada e criptografada.
    </p>

    <div class="hero-buttons">
      <button class="btn-primary" routerLink="/emitir">
        Emitir certificado
      </button>

      <button class="btn-primary" routerLink="/validar">
        Validar certificado
      </button>
    </div>
  </section>

  <!-- CARROSSEL DE IMAGENS -->
  <div class="carousel-container">
    <div class="carousel-track" [style.transform]="carouselTransform">
      
      <div class="carousel-item" *ngFor="let item of carouselItems">
        <img [src]="item.image" alt="slide">
      </div>

    </div>

    <!-- Botões manual -->
    <button class="btn prev" (click)="prev()">&#10094;</button>
    <button class="btn next" (click)="next()">&#10095;</button>
  </div>

</div>
